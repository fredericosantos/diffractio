[project]
name = "diffractio"
version = "1.0.0"
description = "Python Scalar and Vector Diffraction and Interference"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Luis Miguel Sanchez Brea", email = "optbrea@ucm.es" },
]
keywords = ["optics", "diffraction", "interference", "scalar", "vector", "physics", "simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.4.3",
    "matplotlib>=3.10.8",
    "numexpr>=2.14.1",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pillow>=12.1.1",
    "psutil>=7.2.2",
    "py-pol>=1.3.0",
    "pyvista>=0.47.0",
    "scipy>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/optbrea/diffractio"
Documentation = "https://diffractio.readthedocs.io"
Repository = "https://github.com/optbrea/diffractio.git"
Issues = "https://github.com/optbrea/diffractio/issues"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
    "ty>=0.0.16",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG", "PTH",
    "PL", "PERF", "RUF", "C90", "FBT", "G", "INP", "PIE", "PT",
    "RET", "SLF", "SLOT", "TID", "TCH", "INT", "PYI", "Q", "ASYNC",
    "BLE", "A", "DTZ", "T10", "EM", "EXE", "FA", "FIX", "FLY",
    "ICN", "LOG", "PGH", "TRY", "FURB",
]
ignore = [
    # Naming conventions — physics/scientific conventions
    "N802",   # invalid function names (RS, CZT, VFFT, etc.)
    "N806",   # non-lowercase variables (E, Ex, Ey, H, etc.)
    "N801",   # invalid class names (Scalar_field_XY, etc.)
    "N807",   # dunder function names
    "N816",   # mixed-case globals
    "N999",   # invalid module names
    # Private member access — internal library cross-access by design
    "SLF001",
    # Boolean positional arguments — ubiquitous in scientific APIs
    "FBT001",
    "FBT002",
    # Too many arguments — scientific functions naturally have many parameters
    "PLR0913",
    # Blanket type-ignore/noqa
    "PGH003",
    "PGH004",
    # Shebang issues
    "EXE002",
    # Datetime without tz — not relevant for scientific computing
    "DTZ005",
    # os.path usage — fine for this codebase
    "PTH103",
    "PTH110",
    # TODOs are intentional reminders
    "FIX002",
    # Magic values — scientific code uses constants
    "PLR2004",
    # Ternary suggestions — not always clearer
    "SIM108",
    "SIM401",
    # Unused method arguments — method signatures match interfaces
    "ARG002",
    # Lowercase parameter names — physics conventions (N, E, etc.)
    "N803",
    # Global statements — used intentionally in scientific code
    "PLW0603",
    # Too many statements/branches — complex scientific algorithms
    "PLR0915",
    "PLR0912",
    # Shadowing builtins — common in scientific code (id, type, etc.)
    "A001",
    "A002",
    # Ambiguous variable names (l, I, O) — physics conventions
    "E741",
    # Unused function arguments — interface compatibility
    "ARG001",
    # Self/cls assignment — used in some patterns
    "PLW0642",
    # Boolean positional default
    "FBT003",
    # Bare except
    "E722",
    # Complexity
    "C901",
    # Exception inheritance
    "TRY002",
    # Self-assignment
    "PLW0127",
    # Import not at top level — conditional imports used intentionally
    "PLC0415",
    # Useless expression — used for side effects
    "B018",
    # Unicode ambiguous characters — used in physics strings
    "RUF002",
    # os.path alternatives
    "PTH107",
    "PTH100",
    "PTH118",
    "PTH123",
    # Redefined unused — overwritten imports in __init__
    "F811",
    # Exception message formatting
    "EM101",
    "EM102",
    # printf-style formatting — prevalent in legacy codebase
    "UP031",
    # os.listdir — acceptable
    "PTH208",
    "PTH109",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004"]
"docs/*" = ["E501", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["diffractio"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["diffractio"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.13"
python-platform = "linux"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unresolved-import = "warn"
# Upstream numpy/scipy/matplotlib stub incompatibilities with ty
not-subscriptable = "warn"
invalid-argument-type = "warn"
unsupported-operator = "warn"
possibly-missing-attribute = "warn"
# Categories dominated by third-party stub false positives
invalid-assignment = "warn"
unresolved-attribute = "warn"
invalid-parameter-default = "warn"
not-iterable = "warn"
unknown-argument = "warn"
missing-argument = "warn"
no-matching-overload = "warn"
index-out-of-bounds = "warn"
call-non-callable = "warn"
invalid-return-type = "warn"
invalid-type-form = "warn"
unresolved-reference = "warn"

[tool.ty.src]
include = ["diffractio/**/*.py", "tests/**/*.py"]
exclude = ["**/deprecated/**", "**/other/**"]
