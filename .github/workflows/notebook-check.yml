# This workflow will execute Jupyter notebooks to validate they run correctly
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Jupyter notebook build check

env:
  NOTEBOOK_DIR: 'docs'
  EXECUTION_TIMEOUT: 10

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    
    - name: Install dependencies
      run: |
        uv sync --dev
        uv pip install jupyter papermill
    
    - name: Execute notebooks
      continue-on-error: true
      run: |
        notebooks=$(find "$NOTEBOOK_DIR" -name "*.ipynb")
        if [[ -n "$notebooks" ]]; then
          echo "Running notebooks:"
          find "$NOTEBOOK_DIR" -name "*.ipynb" -print0 | while read -r -d $'\0' notebook_path;
          do
            echo "[notebook_path] $notebook_path"
            # Execute notebooks using papermill and silence output
            uv run python -m papermill "$notebook_path" /dev/null  \
              --execution-timeout "$EXECUTION_TIMEOUT"  \
              --no-request-save-on-cell-execute --autosave-cell-every 0
          done
        else
          echo "No Jupyter notebooks found in the 'docs' directory."
        fi

